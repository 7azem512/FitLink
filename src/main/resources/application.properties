spring.application.name=${APPLICATION_NAME}

# Supabase PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.pool-name=${DB_POOL_NAME}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS}

# Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE}
spring.jpa.properties.hibernate.order_inserts=${HIBERNATE_ORDER_INSERTS}
spring.jpa.properties.hibernate.order_updates=${HIBERNATE_ORDER_UPDATES}

# JWT
application.jwt.secret=${JWT_SECRET}

# Google Sign-In
# Web OAuth 2.0 Client ID used as the backend audience for Google ID tokens.
# No Client Secret is required for ID-token verification.
google.client-id=${GOOGLE_CLIENT_ID}
google.require-verified-email=${GOOGLE_REQUIRE_VERIFIED_EMAIL:true}

# Gmail SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}

server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY}

#S3
supabase.storage.endpoint=${SUPABASE_S3_ENDPOINT}
supabase.storage.region=${SUPABASE_S3_REGION}
supabase.storage.access-key=${SUPABASE_S3_ACCESS_KEY}
supabase.storage.secret-key=${SUPABASE_S3_SECRET_KEY}
supabase.storage.bucket=${SUPABASE_S3_BUCKET}

supabase.url=${SUPABASE_URL}

# Multipart uploads (limits enforced by the servlet container)
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:20MB}

# Storage service level limit in bytes (must match MULTIPART_MAX_FILE_SIZE)
supabase.storage.max-file-size-bytes=${SUPABASE_STORAGE_MAX_FILE_SIZE_BYTES:10485760}

# Logging
logging.level.root=${LOG_LEVEL_ROOT}
logging.level.com.project.FitLink=${LOG_LEVEL_APPLICATION}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY}
