spring.application.name=${APPLICATION_NAME}

# Supabase PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.pool-name=${DB_POOL_NAME}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS}

# Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE}
spring.jpa.properties.hibernate.order_inserts=${HIBERNATE_ORDER_INSERTS}
spring.jpa.properties.hibernate.order_updates=${HIBERNATE_ORDER_UPDATES}

# JWT
application.jwt.secret=${JWT_SECRET}

# Gmail SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}

server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY}

# Logging
logging.level.root=${LOG_LEVEL_ROOT}
logging.level.com.project.FitLink=${LOG_LEVEL_APPLICATION}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY}
