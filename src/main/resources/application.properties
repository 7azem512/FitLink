spring.application.name=FitLink
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fitlink}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT Configuration
application.jwt.secret=${JWT_SECRET:your-super-secret-key-change-this-in-production-at-least-32-characters}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:azmex.app@gmail.com}
spring.mail.password=${MAIL_PASSWORD:bovzgzfogqvtubyn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

server.forward-headers-strategy=framework

# Logging Configuration
logging.level.root=WARN
logging.level.com.project.FitLink=INFO
logging.level.org.springframework.security=DEBUG