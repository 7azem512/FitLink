<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .logo { font-size: 24px; font-weight: bold; color: #2d7aff; margin-bottom: 24px; }
        .otp-box { font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #2d7aff; background: #f0f5ff; border-radius: 6px; padding: 16px 24px; display: inline-block; margin: 16px 0; }
        .footer { margin-top: 24px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">AZMEX</div>
    <p>Hi <strong>{{userName}}</strong>,</p>
    <p>Use the code below to verify your email address. It expires in <strong>10 minutes</strong>.</p>
    <div class="otp-box">{{otpCode}}</div>
    <p>If you didn't create an AZMEX account, you can ignore this email.</p>
    <div class="footer">&copy; AZMEX. All rights reserved.</div>
</div>
</body>
</html>
